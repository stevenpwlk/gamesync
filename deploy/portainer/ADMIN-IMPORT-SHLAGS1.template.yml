name: gamesavehub-admin-import-shlags1-temp

services:
  admin:
    image: gamesavehub-admin:0.1.0
    command:
      - world
      - import
      - REPLACE_WITH_SHLAGS1_WORLD_GUID
      - /imports/SHLAGS1-CANONICAL-ROUNDTRIP-20260807.gshsave
    environment:
      GSH_CONNECTION_STRING: Data Source=/data/gamesavehub.db;Cache=Shared;Pooling=True
      GSH_STORAGE_ROOT: /data
      GSH_MAX_ARTIFACT_BYTES: 67108864
    volumes:
      - /Volume2/gamesavehub/data:/data
      - /Volume2/gamesavehub/imports:/imports:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    external: true
    name: gamesavehub_backend
